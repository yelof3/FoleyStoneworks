<!-- Footer -->
<footer class="wrapper style1 align-center">
    <div class="inner">
        <ul class="icons">
            {{ with .Site.Params.social.email }}<li><a href="mailto:{{ . }}" class="icon solid style2 fa-envelope"><span class="label">Email</span></a></li>{{ end }}
            {{ with .Site.Params.social.phone }}<li><a href="tel:{{ . }}" class="icon solid style2 fa-phone"><span class="label">Phone</span></a></li>{{ end }}

        </ul>
        <p>Made with the <a target="_blank" href="https://github.com/caressofsteel/hugo-story">Hugo Story</a></span> theme
</div>
</footer>

<!-- FontAwesome JS -->
{{ range .Site.Params.asset.fontawesome_js -}}
    <script type="text/javascript" src="{{ . | absURL }}"></script>
{{- end }}
